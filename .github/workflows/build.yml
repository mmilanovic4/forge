name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires this to be resolvable to generate the
      # client, but nothing in the build actually connects — any
      # well-formed value works.
      DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm install

      - run: npm run db:generate

      - name: next build
        run: npm run build 2>&1 | tee build.log

      - name: fail on Turbopack warnings
        run: |
          if grep -q "Turbopack build encountered" build.log; then
            echo "::error::Build succeeded but produced warnings — see the 'next build' step above."
            exit 1
          fi
